name: Build Little Car Workshop (Android + Windows)

# Build automatically on every push, and allow manual runs from the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: EditMode + PlayMode smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Runs the LittleGarage.Tests assemblies that exist in the repository.
      # The old LittleCarWashBuild.VisualVerification flow targets the legacy
      # GameController/GameData/CarArt scene and is intentionally not invoked.
      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # unity-test-runner@v4 translates `coverageEnabled: false` into
          # `--no-coverageEnabled`, but game-ci/cli sets yargs
          # `negation-prefix: false`, so that flag is rejected as an unknown
          # argument and the run exits 1 before Unity starts. The CLI's
          # documented GAME_CI_* env mapping reaches the same option without
          # emitting the broken flag.
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          unityVersion: 2022.3.61f1
          testMode: all
          # `latest` makes the action call the GitHub Releases API to resolve
          # the tag; on shared runners that API frequently returns 403
          # (rate limit). Pinning skips the lookup and is fully cached.
          cliVersion: v0.1.77
          artifactsPath: build/verification

      # The CLI's final error is only Docker's pull output; the real reason
      # lives in Unity's log. Re-print its decisive lines at the END of the
      # step so they survive log truncation/copying.
      - name: Summarize Unity test failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          found=0
          for f in build/verification/*.log; do
            [ -f "$f" ] || continue
            found=1
            echo "===== $f ====="
            grep -n -i -E 'aborting batchmode|error CS[0-9]+|compilation failed|scripts have compiler errors|exception|error:|failed|license' "$f" | tail -n 100 || true
            echo "===== end $f ====="
          done
          if [ "$found" -eq 0 ]; then
            echo "No Unity logs found under build/verification - the container failed before Unity wrote a log."
          fi

      # Must run even when the test step fails: playmode.log / editmode.log
      # and the result XMLs are the only place the real Unity failure reason
      # is recorded.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityTestResults
          path: build/verification
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            buildMethod: LittleCarWashBuild.Build.Run
            artifactPath: build/Android/LittleCarWash.apk
          - target: StandaloneWindows64
            buildMethod: BuildScript.BuildWindowsCI
            artifactPath: Builds/Windows/LittleCarWorkshop.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.61f1
          targetPlatform: ${{ matrix.target }}
          buildName: LittleCarWash
          buildMethod: ${{ matrix.buildMethod }}
          versioning: None
          allowDirtyBuild: true

      - name: Check expected build artifact
        env:
          EXPECTED_ARTIFACT: ${{ matrix.artifactPath }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$EXPECTED_ARTIFACT" ]; then
            echo "Build did not produce expected file: $EXPECTED_ARTIFACT" >&2
            find . -maxdepth 4 -type f \( -name '*.exe' -o -name '*.apk' \) -print >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleCarWash-${{ matrix.target }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish in-app update manifest
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*public const string Version = "\([^"]*\)".*/\1/p' Assets/Scripts/AppInfo.cs | head -n 1)
          VERSION_CODE=$(sed -n 's/.*public const int VersionCode = \([0-9]*\).*/\1/p' Assets/Scripts/AppInfo.cs | head -n 1)
          NOTES=$(git log -1 --pretty=%s)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Cannot read AppInfo version" >&2
            exit 1
          fi
          # upload-artifact stores a single-file artifact at the artifact root.
          APK="release-artifacts/LittleCarWash-Android/LittleCarWash.apk"
          EXE="release-artifacts/LittleCarWash-StandaloneWindows64/LittleCarWorkshop.exe"
          if [ ! -f "$APK" ] || [ ! -f "$EXE" ]; then
            echo "Missing APK or Windows executable at the expected artifact paths" >&2
            echo "APK: $APK" >&2
            echo "EXE: $EXE" >&2
            find release-artifacts -type f | head -n 50 >&2
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/LittleCarWash-android.apk
          WIN_DIR=$(dirname "$EXE")
          (cd "$WIN_DIR" && zip -q -r "$GITHUB_WORKSPACE/release/LittleCarWash-windows.zip" .)
          jq -n \
            --arg version "$VERSION" \
            --argjson code "$VERSION_CODE" \
            --arg notes "$NOTES" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{version: $version, versionCode: $code, notes: $notes,
              androidUrl: ("https://github.com/" + $repo + "/releases/latest/download/LittleCarWash-android.apk"),
              windowsUrl: ("https://github.com/" + $repo + "/releases/latest/download/LittleCarWash-windows.zip")}' \
            > release/update.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          cat release/update.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: Little Car Wash ${{ env.VERSION }}
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: |
            release/update.json
            release/LittleCarWash-android.apk
            release/LittleCarWash-windows.zip
